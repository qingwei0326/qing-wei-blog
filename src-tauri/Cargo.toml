[package]
name = "qingwei-blog-assistant"
version = "1.0.0"
description = "青微的博客 - 写作发布工具"
authors = ["qingwei"]
edition = "2021"

[lib]
name = "qingwei_blog_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
gray_matter = "0.2"
pulldown-cmark = "0.12"
pinyin = "0.10"
slug = "0.1"
chrono = "0.4"
walkdir = "2"
image = "0.25"
arboard = "3"
rand = "0.8"
hex = "0.4"
regex = "1"
tokio = { version = "1", features = ["full"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
