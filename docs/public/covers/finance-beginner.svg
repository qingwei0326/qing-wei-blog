<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cover-title">
  <title id="cover-title">算账 · 理财基础</title>
  <defs>
    <linearGradient id="bg-warm" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4EFE4"/>
      <stop offset="1" stop-color="#E9E0CB"/>
    </linearGradient>
    <linearGradient id="block-ink" x1="700" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1B3D6E"/>
      <stop offset="1" stop-color="#0E2A52"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg-warm)"/>

  <!-- 右下深色斜切色块 -->
  <path d="M780 0 L1200 0 L1200 675 L640 675 Z" fill="url(#block-ink)"/>

  <!-- 上下细规则线 -->
  <line x1="80" y1="92" x2="700" y2="92" stroke="#1B3D6E" stroke-width="1.5" opacity="0.35"/>
  <line x1="80" y1="595" x2="700" y2="595" stroke="#1B3D6E" stroke-width="1.5" opacity="0.35"/>

  <!-- 顶部 kicker -->
  <text x="80" y="68" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="800" letter-spacing="4" fill="#1B3D6E" opacity="0.7">FINANCE · 01</text>

  <!-- 主标题：算账 -->
  <text x="80" y="340" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="240" font-weight="900" fill="#1B3D6E" letter-spacing="-6">算账</text>

  <!-- 副标题 -->
  <text x="84" y="410" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="34" font-weight="600" fill="#1B3D6E" opacity="0.78">不教理财，看清每一笔交换</text>
  <text x="84" y="460" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="500" fill="#1B3D6E" opacity="0.55">大学生最负担得起的能力，是多想一步</text>

  <!-- 落款 -->
  <text x="80" y="625" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#1B3D6E" opacity="0.55">青微的博客 · 理财基础</text>

  <!-- 右侧深色块上：¥ 与算式 -->
  <text x="900" y="240" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="180" font-weight="900" fill="#FFFFFF">¥</text>

  <line x1="870" y1="290" x2="1130" y2="290" stroke="#FFFFFF" stroke-width="2" opacity="0.4"/>

  <text x="870" y="360" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" opacity="0.92">交出去 · 什么</text>
  <text x="870" y="410" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" opacity="0.92">换回来 · 什么</text>

  <line x1="870" y1="445" x2="1130" y2="445" stroke="#FFFFFF" stroke-width="2" opacity="0.4"/>

  <text x="870" y="500" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="42" font-weight="900" fill="#FFC857">= ?</text>
</svg>
