<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cover-title">
  <title id="cover-title">三个我 · 个人观察</title>
  <defs>
    <linearGradient id="bg-warm" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4EFE4"/>
      <stop offset="1" stop-color="#E9E0CB"/>
    </linearGradient>
    <linearGradient id="block-charcoal" x1="700" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3A2A22"/>
      <stop offset="1" stop-color="#1B1208"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg-warm)"/>

  <!-- 右下深色斜切色块 -->
  <path d="M780 0 L1200 0 L1200 675 L640 675 Z" fill="url(#block-charcoal)"/>

  <!-- 上下细规则线 -->
  <line x1="80" y1="92" x2="700" y2="92" stroke="#3A2A22" stroke-width="1.5" opacity="0.35"/>
  <line x1="80" y1="595" x2="700" y2="595" stroke="#3A2A22" stroke-width="1.5" opacity="0.35"/>

  <!-- 顶部 kicker -->
  <text x="80" y="68" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="800" letter-spacing="4" fill="#3A2A22" opacity="0.7">OBSERVATION · 03</text>

  <!-- 主标题:三个我 -->
  <text x="80" y="340" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="200" font-weight="900" fill="#3A2A22" letter-spacing="-4">三个我</text>

  <!-- 副标题 -->
  <text x="84" y="410" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="34" font-weight="600" fill="#3A2A22" opacity="0.78">同一个人,半小时,三套语气</text>
  <text x="84" y="460" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="500" fill="#3A2A22" opacity="0.55">关系决定身份,不是性格决定关系</text>

  <!-- 落款 -->
  <text x="80" y="625" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#3A2A22" opacity="0.55">青微的博客 · 个人观察</text>

  <!-- 右侧深色块上:三个错位重叠的"我" -->
  <text x="820" y="290" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="220" font-weight="900" fill="#FFFFFF" opacity="0.92">我</text>
  <text x="890" y="380" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="220" font-weight="900" fill="#FFC857" opacity="0.78">我</text>
  <text x="960" y="470" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="220" font-weight="900" fill="#FFFFFF" opacity="0.35">我</text>

  <!-- 三条连接细线,暗示三个"我"是同一人的不同位置 -->
  <line x1="830" y1="535" x2="1170" y2="535" stroke="#FFFFFF" stroke-width="1.5" opacity="0.3"/>
  <text x="830" y="565" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" opacity="0.6">朋友 · 长辈 · 同辈</text>
</svg>
