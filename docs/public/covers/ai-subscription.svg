<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cover-title">
  <title id="cover-title">订阅 · 苹果渠道海外订阅</title>
  <defs>
    <linearGradient id="bg-rose" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8EDEF"/>
      <stop offset="1" stop-color="#E8D5DA"/>
    </linearGradient>
    <linearGradient id="block-wine" x1="700" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6B1F3D"/>
      <stop offset="1" stop-color="#3A0F22"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg-rose)"/>

  <!-- 右下深色斜切色块 -->
  <path d="M780 0 L1200 0 L1200 675 L640 675 Z" fill="url(#block-wine)"/>

  <!-- 上下细规则线 -->
  <line x1="80" y1="92" x2="700" y2="92" stroke="#6B1F3D" stroke-width="1.5" opacity="0.35"/>
  <line x1="80" y1="595" x2="700" y2="595" stroke="#6B1F3D" stroke-width="1.5" opacity="0.35"/>

  <!-- 顶部 kicker -->
  <text x="80" y="68" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="800" letter-spacing="4" fill="#6B1F3D" opacity="0.7">AI · 10</text>

  <!-- 主标题：订阅 -->
  <text x="80" y="340" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="240" font-weight="900" fill="#6B1F3D" letter-spacing="-6">订阅</text>

  <!-- 副标题 -->
  <text x="84" y="410" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="34" font-weight="600" fill="#6B1F3D" opacity="0.82">国区订不到也能上</text>
  <text x="84" y="460" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="34" font-weight="600" fill="#6B1F3D" opacity="0.82">苹果渠道 + 礼品卡</text>

  <!-- 落款 -->
  <text x="80" y="625" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#6B1F3D" opacity="0.55">青微的博客 · 工具与效率</text>

  <!-- 右侧深色块：AI 月费对比 -->
  <text x="820" y="180" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" letter-spacing="3" opacity="0.55">AI 月费 · 双账号</text>

  <text x="820" y="245" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" opacity="0.55">美区原价</text>
  <text x="1130" y="245" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="900" fill="#FFFFFF" opacity="0.55" text-anchor="end">¥145</text>

  <text x="820" y="300" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" opacity="0.7">苹果渠道</text>
  <text x="1130" y="300" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="900" fill="#FFFFFF" opacity="0.7" text-anchor="end">¥80</text>

  <line x1="820" y1="335" x2="1130" y2="335" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4"/>

  <text x="820" y="390" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" opacity="0.7">月省</text>
  <text x="1130" y="390" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="900" fill="#FFC857" text-anchor="end">¥125</text>

  <line x1="820" y1="430" x2="1130" y2="430" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4"/>

  <text x="820" y="490" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="800" fill="#FFC857">年累计</text>
  <text x="1130" y="490" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="44" font-weight="900" fill="#FFC857" text-anchor="end">¥1500</text>

  <!-- 小标注 -->
  <text x="820" y="535" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" opacity="0.55">≈ 多订一份订阅</text>
</svg>
