<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cover-title">
  <title id="cover-title">通勤 · 9 元买回 1 小时睡眠</title>
  <defs>
    <linearGradient id="bg-dawn" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EFF3F8"/>
      <stop offset="1" stop-color="#DBE4EC"/>
    </linearGradient>
    <linearGradient id="block-night" x1="0" y1="0" x2="500" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1F2D3D"/>
      <stop offset="1" stop-color="#0B131F"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg-dawn)"/>

  <!-- 左侧深色斜切色块 -->
  <path d="M0 0 L500 0 L420 675 L0 675 Z" fill="url(#block-night)"/>

  <!-- 左侧色块上：月亮（用两个圆做出弯月） -->
  <circle cx="200" cy="285" r="105" fill="#FFFFFF" opacity="0.96"/>
  <circle cx="232" cy="270" r="100" fill="#1F2D3D"/>

  <!-- 月亮旁三个 Z（睡眠意象） -->
  <text x="300" y="225" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="56" font-weight="900" fill="#FFC857" opacity="0.92">Z</text>
  <text x="345" y="180" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="42" font-weight="900" fill="#FFC857" opacity="0.6">z</text>
  <text x="378" y="148" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="900" fill="#FFC857" opacity="0.32">z</text>

  <!-- 左侧色块下方：成本/收益对照 -->
  <line x1="80" y1="450" x2="380" y2="450" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4"/>
  <text x="80" y="495" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" opacity="0.85">交出去 · 9 元</text>
  <text x="80" y="535" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" opacity="0.85">换回来 · 1 小时睡眠</text>

  <!-- 右侧 kicker + 横线 -->
  <text x="550" y="86" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="800" letter-spacing="4" fill="#1F2D3D" opacity="0.7">COMMUTE · 04</text>
  <line x1="550" y1="115" x2="1120" y2="115" stroke="#1F2D3D" stroke-width="1.5" opacity="0.35"/>

  <!-- 主标题：通勤 -->
  <text x="550" y="290" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="170" font-weight="900" fill="#1F2D3D" letter-spacing="-4">通勤</text>

  <!-- 副标题 -->
  <text x="552" y="350" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="34" font-weight="600" fill="#1F2D3D" opacity="0.78">远距离的隐形成本优化</text>

  <!-- 中间核心等式：¥9 = 1h -->
  <text x="552" y="475" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="84" font-weight="900" fill="#1F2D3D">¥9</text>
  <text x="700" y="475" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="84" font-weight="900" fill="#1F2D3D" opacity="0.55">≈</text>
  <text x="775" y="475" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="84" font-weight="900" fill="#C97A4A">1h</text>
  <text x="900" y="475" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="600" fill="#1F2D3D" opacity="0.55">睡眠</text>

  <!-- 底部线 + 落款 -->
  <line x1="550" y1="565" x2="1120" y2="565" stroke="#1F2D3D" stroke-width="1.5" opacity="0.35"/>
  <text x="550" y="600" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#1F2D3D" opacity="0.55">青微的博客 · 生活优化</text>
</svg>
