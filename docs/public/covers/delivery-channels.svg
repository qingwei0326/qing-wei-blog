<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cover-title">
  <title id="cover-title">寄件 · 渠道与窗口</title>
  <defs>
    <linearGradient id="bg-kraft" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FBF5EA"/>
      <stop offset="1" stop-color="#F0E4D0"/>
    </linearGradient>
    <linearGradient id="block-ember" x1="700" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B9472A"/>
      <stop offset="1" stop-color="#5E1F10"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg-kraft)"/>

  <!-- 右下深色斜切色块 -->
  <path d="M780 0 L1200 0 L1200 675 L640 675 Z" fill="url(#block-ember)"/>

  <!-- 上下细规则线 -->
  <line x1="80" y1="92" x2="700" y2="92" stroke="#B9472A" stroke-width="1.5" opacity="0.35"/>
  <line x1="80" y1="595" x2="700" y2="595" stroke="#B9472A" stroke-width="1.5" opacity="0.35"/>

  <!-- 顶部 kicker -->
  <text x="80" y="68" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="800" letter-spacing="4" fill="#B9472A" opacity="0.7">DELIVERY · 08</text>

  <!-- 主标题：寄件 -->
  <text x="80" y="340" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="240" font-weight="900" fill="#B9472A" letter-spacing="-6">寄件</text>

  <!-- 副标题 -->
  <text x="84" y="410" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="34" font-weight="600" fill="#B9472A" opacity="0.82">5 折在缩水</text>
  <text x="84" y="460" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="34" font-weight="600" fill="#B9472A" opacity="0.82">留意你常用的渠道</text>

  <!-- 落款 -->
  <text x="80" y="625" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#B9472A" opacity="0.55">青微的博客 · 省钱实操</text>

  <!-- 右侧深色块上：同 2kg 顺丰 vs 京东 对比 -->
  <text x="820" y="180" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" letter-spacing="3" opacity="0.55">同样 2kg · 同隔天到</text>

  <text x="820" y="270" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" opacity="0.6">顺丰学生</text>
  <text x="1130" y="270" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="38" font-weight="900" fill="#FFFFFF" opacity="0.6" text-anchor="end">¥22</text>

  <line x1="820" y1="305" x2="1130" y2="305" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4"/>

  <text x="820" y="370" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="800" fill="#FFC857">京东 5 折</text>
  <text x="1130" y="370" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="44" font-weight="900" fill="#FFC857" text-anchor="end">¥10</text>

  <!-- 差价提示 -->
  <line x1="820" y1="430" x2="1130" y2="430" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4"/>
  <text x="820" y="480" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" opacity="0.7">单次差</text>
  <text x="1130" y="480" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="38" font-weight="900" fill="#FFC857" text-anchor="end">¥12</text>

  <!-- 小标注 -->
  <text x="820" y="525" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" opacity="0.55">≈ 3 杯奶茶</text>
</svg>
