<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cover-title">
  <title id="cover-title">二手 · 1370 拿下 Neo7</title>
  <defs>
    <linearGradient id="bg-ice" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2F4F6"/>
      <stop offset="1" stop-color="#DCE2E6"/>
    </linearGradient>
    <linearGradient id="block-teal" x1="0" y1="0" x2="500" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1F3A40"/>
      <stop offset="1" stop-color="#0D1A20"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg-ice)"/>

  <!-- 左侧深色斜切色块 -->
  <path d="M0 0 L500 0 L420 675 L0 675 Z" fill="url(#block-teal)"/>

  <!-- 左侧色块上：手机轮廓（简化形状） -->
  <g transform="translate(140, 165)">
    <rect x="0" y="0" width="140" height="240" rx="22" ry="22" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.5"/>
    <rect x="10" y="14" width="120" height="200" rx="3" fill="#FFFFFF" opacity="0.12"/>
    <circle cx="70" cy="227" r="5" fill="#FFFFFF" opacity="0.5"/>
    <!-- 屏幕上简化 UI -->
    <rect x="22" y="32" width="96" height="6" rx="2" fill="#FFFFFF" opacity="0.35"/>
    <rect x="22" y="48" width="60" height="6" rx="2" fill="#FFFFFF" opacity="0.25"/>
    <rect x="22" y="80" width="96" height="32" rx="4" fill="#FFC857" opacity="0.9"/>
    <text x="70" y="103" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="900" fill="#0D1A20" text-anchor="middle">闲鱼</text>
    <rect x="22" y="124" width="96" height="40" rx="4" fill="#FFFFFF" opacity="0.2"/>
    <text x="70" y="150" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" opacity="0.75" text-anchor="middle">¥1370</text>
  </g>

  <!-- 左下数据 -->
  <line x1="80" y1="450" x2="380" y2="450" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4"/>
  <text x="80" y="495" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" opacity="0.85">含 22 个月延保</text>
  <text x="80" y="535" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" opacity="0.85">比新机便宜 800+</text>

  <!-- 右侧 kicker + 横线 -->
  <text x="550" y="86" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="800" letter-spacing="4" fill="#1F3A40" opacity="0.7">RESALE · 07</text>
  <line x1="550" y1="115" x2="1120" y2="115" stroke="#1F3A40" stroke-width="1.5" opacity="0.35"/>

  <!-- 主标题：二手 -->
  <text x="550" y="290" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="170" font-weight="900" fill="#1F3A40" letter-spacing="-4">二手</text>

  <!-- 副标题 -->
  <text x="552" y="350" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="34" font-weight="600" fill="#1F3A40" opacity="0.78">新机便宜不等于能买到</text>

  <!-- 价格对比 -->
  <text x="552" y="445" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#1F3A40" opacity="0.55">百亿补贴砍到</text>
  <text x="552" y="490" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="48" font-weight="900" fill="#1F3A40" opacity="0.45" text-decoration="line-through">¥1315.8</text>
  <text x="780" y="487" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="700" fill="#1F3A40" opacity="0.55">风控拦截</text>

  <text x="552" y="530" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#1F3A40" opacity="0.75">闲鱼实付</text>
  <text x="552" y="572" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="56" font-weight="900" fill="#C97A4A">¥1370</text>

  <!-- 底部线 + 落款 -->
  <line x1="550" y1="608" x2="1120" y2="608" stroke="#1F3A40" stroke-width="1.5" opacity="0.35"/>
  <text x="550" y="640" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#1F3A40" opacity="0.55">青微的博客 · 消费观察</text>
</svg>
