<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cover-title">
  <title id="cover-title">拆账 · 消费观察</title>
  <defs>
    <linearGradient id="bg-paper" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4EFE4"/>
      <stop offset="1" stop-color="#E9DDC8"/>
    </linearGradient>
    <linearGradient id="block-rust" x1="700" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B3A2F"/>
      <stop offset="1" stop-color="#4A1A12"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg-paper)"/>

  <!-- 右下深色斜切色块 -->
  <path d="M780 0 L1200 0 L1200 675 L640 675 Z" fill="url(#block-rust)"/>

  <!-- 上下细规则线 -->
  <line x1="80" y1="92" x2="700" y2="92" stroke="#8B3A2F" stroke-width="1.5" opacity="0.35"/>
  <line x1="80" y1="595" x2="700" y2="595" stroke="#8B3A2F" stroke-width="1.5" opacity="0.35"/>

  <!-- 顶部 kicker -->
  <text x="80" y="68" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="800" letter-spacing="4" fill="#8B3A2F" opacity="0.7">CONSUMER · 06</text>

  <!-- 主标题：拆账 -->
  <text x="80" y="340" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="240" font-weight="900" fill="#8B3A2F" letter-spacing="-6">拆账</text>

  <!-- 副标题 -->
  <text x="84" y="410" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="34" font-weight="600" fill="#8B3A2F" opacity="0.82">多数套路不是商家骗你</text>
  <text x="84" y="460" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="34" font-weight="600" fill="#8B3A2F" opacity="0.82">是你没看见拆解</text>

  <!-- 落款 -->
  <text x="80" y="625" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#8B3A2F" opacity="0.55">青微的博客 · 消费观察</text>

  <!-- 右侧深色块上：四档价格阶梯对比（同一台机不同渠道） -->
  <text x="820" y="180" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" letter-spacing="3" opacity="0.55">同一台 · 真我 GT5</text>

  <text x="820" y="240" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" opacity="0.5">官网</text>
  <text x="1010" y="240" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="900" fill="#FFFFFF" opacity="0.5" text-anchor="end">¥2788</text>

  <text x="820" y="295" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" opacity="0.65">淘宝</text>
  <text x="1010" y="295" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="900" fill="#FFFFFF" opacity="0.65" text-anchor="end">¥2538</text>

  <text x="820" y="350" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" opacity="0.78">拼多多</text>
  <text x="1010" y="350" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="900" fill="#FFFFFF" opacity="0.78" text-anchor="end">¥2278</text>

  <line x1="820" y1="378" x2="1130" y2="378" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4"/>

  <text x="820" y="425" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="800" fill="#FFC857">本地店</text>
  <text x="1010" y="425" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="38" font-weight="900" fill="#FFC857" text-anchor="end">¥2198</text>

  <!-- 差价提示 -->
  <line x1="820" y1="475" x2="1130" y2="475" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4"/>
  <text x="820" y="525" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" opacity="0.7">最高 − 最低</text>
  <text x="1010" y="525" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="900" fill="#FFC857" text-anchor="end">¥590</text>
</svg>
